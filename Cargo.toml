[package]
name = "crabbymetrics"
version = "0.7.0"
edition = "2021"

[lib]
name = "crabbymetrics"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
numpy = "0.27"
ndarray = "=0.16.1"
linfa = "0.8.1"
linfa-linear = "0.8.1"
linfa-logistic = "0.8.1"
linfa-elasticnet = "0.8.1"
linfa-ftrl = "0.8.1"
linfa-kernel = "0.8.1"
linfa-reduction = "0.8.1"
linfa-linalg = "0.2.1"
rand = "0.8"
rand09 = { package = "rand", version = "0.9.2" }
rand_xoshiro = "0.7.0"
argmin = "0.11"
argmin-math = "0.5"
within = "0.1.0"
nalgebra = "0.33"
