[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "crabbymetrics"
dynamic = ["version"]
description = "Rust-backed econometrics models with a scikit-adjacent Python API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
docs = [
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
]
test = [
    "lifelines>=0.30.0",
    "pyfixest>=0.50.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "statsmodels>=0.14.6",
]

[project.urls]
Homepage = "https://github.com/apoorvalal/crabbymetrics"
Repository = "https://github.com/apoorvalal/crabbymetrics"
Issues = "https://github.com/apoorvalal/crabbymetrics/issues"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.maturin]
module-name = "crabbymetrics"
features = ["pyo3/extension-module"]
exclude = [
    { path = "docs/**/*", format = "sdist" },
    { path = "ding_ci/**/*", format = "sdist" },
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "lifelines>=0.30.0",
    "maturin>=1.12.6",
    "pytest>=8.3.5",
    "statsmodels>=0.14.6",
]
docs = [
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
]
test = [
    "lifelines>=0.30.0",
    "pyfixest>=0.50.1",
    "pytest>=8.3.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "statsmodels>=0.14.6",
]
