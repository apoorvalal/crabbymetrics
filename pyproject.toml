[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "crabbymetrics"
dynamic = ["version"]
description = "Rust-backed econometrics models with a scikit-adjacent Python API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
docs = [
    "jupyter-cache>=0.6.1",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/apoorvalal/crabbymetrics"
Repository = "https://github.com/apoorvalal/crabbymetrics"
Issues = "https://github.com/apoorvalal/crabbymetrics/issues"

[tool.maturin]
module-name = "crabbymetrics"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "maturin>=1.12.6",
    "pytest>=8.3.5",
]
