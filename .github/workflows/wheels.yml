name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, e.g. 0.6.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare release ref
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin master --tags

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
              echo "Run release dispatches from the master branch." >&2
              exit 1
            fi

            version="${{ inputs.version }}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([._+\-]?[0-9A-Za-z]+)*$ ]]; then
              echo "Version must look like 0.6.1 or 0.7.0rc1, without a leading v." >&2
              exit 1
            fi
            tag="v${version}"

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Tag ${tag} already exists." >&2
              exit 1
            fi

            git checkout master
            git pull --ff-only origin master

            python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          path = Path("Cargo.toml")
          lines = path.read_text().splitlines()
          in_package = False
          replaced = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[package]":
                  in_package = True
                  continue
              if stripped.startswith("[") and stripped != "[package]":
                  in_package = False
              if in_package and stripped.startswith("version = "):
                  lines[i] = f'version = "{version}"'
                  replaced = True
                  break
          if not replaced:
              raise SystemExit("Could not find [package] version in Cargo.toml")
          path.write_text("\n".join(lines) + "\n")
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add Cargo.toml
            if ! git diff --cached --quiet; then
              git commit -m "Bump version to ${version}"
              git push origin HEAD:master
            else
              echo "Cargo.toml already has version ${version}; tagging current master."
            fi

            git tag -a "${tag}" -m "${tag}"
            git push origin "${tag}"
            ref="$(git rev-parse HEAD)"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            ref="${GITHUB_SHA}"
          fi

          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish=true" >> "${GITHUB_OUTPUT}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: python -m pip install --upgrade pip maturin pytest ".[test]"

      - name: Build wheel
        run: maturin build --release --interpreter python

      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps "$(ls target/wheels/*manylinux*.whl | head -n 1)"

      - name: Run tests
        run: python -m pytest

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheels (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python${{ matrix.python }}
          manylinux: auto

      - name: Build wheels (macOS)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  sdist:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, test, build, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, test, build, sdist]
    runs-on: ubuntu-latest

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
